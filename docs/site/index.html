call or only by a copy of a\n   confirm value (iterate until stable).\n2. Write `guard_blocks(cfg)`: the `if_true` target of every `Branch` whose condition is a confirm\n   value.\n3. Write the check (algorithm 6.5): for every irreversible call in a reachable block, in layout\n   order, test whether some guard block dominates the block (using `cfg.dominators`); otherwise\n   choose E502 or E501 (D8).\n4. Write `offending_path(cfg, target, avoid)`: BFS from entry that never enters a block in\n   `avoid`, returning `PathStep`s with a note per block and branch edge, ending with the call.\n5. Write `ApprovalReport` (dominator sets, guard blocks, verdict per irreversible call) and\n   `artifact()`; `analyze_approval(cfgs)` runs every task.\n6. In `pipeline.py`, add the `approval` phase on the unoptimized CFGs, after taint.\n7. Regenerate goldens, write tests, update docs.\n\n**Tests (`test_approval.py`)**: `valid_cleanup.as` passes (`let ok = confirm(..); if (ok)`);\n`valid_report.as` passes (no irreversible call); `if (confirm(..)) { delete_file(..) }` passes;\n`approval_missing.as` fails E501 at 7:14 with a path through the `force` true edge;\n`approval_one_branch.as` fails E502 at 9:12; a delete in the `else` of `if (confirm(..))` fails;\n`if (confirm(..) == true)` is not accepted; a bare `confirm(..);` before a delete gives E502; a\ndelete nested inside an inner `if` within the guard block passes; a delete inside `repeat` within\nthe guard passes; two confirms on two branches before a join fail (documented limitation); the\npath never passes through a guard block when one avoiding all guards exists.\n\n**Docs to update:** `07-approval-analysis.md`; `demo-script.md` section \"Approval\";\n`viva-notes.md` dominator questions and the approval limitations.\n\n**Gate:** `.venv/bin/pytest -q` all pass; `.venv/bin/python -m agentscript compile\nexamples/valid_cleanup.as` exits 0; `.venv/bin/python -m agentscript compile\nexamples/approval_missing.as` fails with E501 at 7:14 and exits 1; `.venv/bin/python -m agentscript\ncompile examples/approval_one_branch.as` fails with E502 at 9:12 and exits 1; docs updated.\n\n### M6: editor and API (about 8 h)\n\n**Requirements:** the PRD editor section and every success metric.\n\n**Files:** create `agentscript/api.py`, `web/index.html`, `web/app.js`, `web/style.css`,\n`tests/test_api.py`; change `agentscript/__main__.py` (`serve`).\n\n**Steps**\n\n1. In `api.py`, write the FastAPI app: `GET /` returns `web/index.html`, `/static` serves `web/`,\n   `GET /examples` reads `examples/manifest.json` and adds each file's source, `POST /compile`\n   returns `compile_source(source).to_dict()`, `POST /run` returns `run_source(...)` (section 8).\n2. In `__main__.py`, implement `serve [--port]` (default 8000) with `uvicorn.run`.\n3. Write `web/index.html`: toolbar (example picker, Compile, Run, task select, args JSON box, live\n   toggle, deny-confirm toggle), code pane on the left, tabs on the right (Tokens, AST, Symbols,\n   Errors, IR, CFG, Taint, Approval, Optimized IR, Rounds, Bytecode, Output). Load CodeMirror 5\n   and Mermaid from cdnjs with exact versions.\n4. In `app.js`, write the AgentScript CodeMirror simple mode (keywords, tool names, strings,\n   numbers, comments).\n5. Write `compile()`: POST `/compile`, put each phase's `text` in its tab, `null` phases show\n   \"not run (stopped at \u003cphase>)\", render the CFG tab's `mermaid` text with Mermaid, and fill the\n   task select and args box from `tasks`.\n6. Write the squiggles: for each diagnostic with `line >= 1`, `markText` a wavy underline from\n   `col` to the end of the token and add a gutter marker with the message; list every diagnostic\n   and its `path` steps in the Errors tab; clicking a step moves the cursor there.\n7. Write the taint view: highlight untrusted variables from the taint artifact's `data`, and on\n   E401 highlight each path step.\n8. Write the approval view: list guard blocks and the verdict per irreversible call from the\n   approval artifact's `data`, and on E501/E502 highlight each `path` step from entry to the call.\n9. Write the optimization view: show `stats.before` and `stats.after` (instructions and calls) at\n   the top of the Optimized IR tab.\n10. Write `run()`: POST `/run`, show the call log table (n, round, tool, args, result, note),\n    `calls_used / budget`, the returned value, or the runtime diagnostic.\n11. Write the example picker from `GET /examples` (title, description, expected result) that\n    loads the source and pre-fills the run request.\n12. Write `style.css`: two-pane layout, readable monospace, tab bar, error colours.\n13. Write the tests below, rehearse the full demo script in the browser, update the docs.\n\n**Tests (`test_api.py`)**: `GET /` returns HTML; `GET /examples` returns every manifest entry\nwith its source; `POST /compile` on `valid_report.as` returns `ok: true` and all phase keys with\n`text` and `data`; on `taint_injection.as` returns `ok: false`, one E401 diagnostic with a path,\nand `optimized_ir: null`; `POST /run` on `valid_report.as` returns `value: true` and 5 calls; on a\ncompile error returns `calls: []`; on `runtime_budget.as` with `times = 5` returns E601 and the 3\ncalls made; an unknown task returns E604.\n\n**Docs to update:** `10-editor-and-api.md`; `00-overview.md` (final notes or screenshots,\noptional); `demo-script.md` section \"Setup\" and the real output of every step; `viva-notes.md`\neditor and API questions.\n\n**Gate:** `.venv/bin/pytest -q` all pass; `.venv/bin/python -m agentscript serve`, then the full\ndemo script runs in the browser without touching the terminal; docs updated.\n\n### M7 (optional): parallel scheduling (about 4 h)\n\nStart only when M1 to M6 have passed their gates.\n\n**Requirements:** L1, L2, L3.\n\n**Files:** create `agentscript/scheduler.py`, `tests/test_scheduler.py`; change\n`agentscript/codegen.py` (`ParallelCalls` -> `CALL_PARALLEL`), `agentscript/vm.py` (concurrent\nrounds, `round` in the call log), `agentscript/pipeline.py` (`schedule` phase, `rounds_before`,\n`rounds_after`), `web/app.js` (Rounds tab), `tests/golden/*.json`, `tests/test_vm.py`.\n\n**Steps**\n\n1. Write `build_deps(instrs)` for one block: an edge i -> j (i before j) for read-after-write,\n   write-after-read and write-after-write on any variable, and between two calls when either tool\n   is a `barrier`.\n2. Write `schedule_block(block)`: the list scheduler (algorithm 6.7), producing `ParallelCalls`\n   for rounds of two or more calls.\n3. Write `schedule(cfg)` (deep copy, every block) and `ScheduleReport` (rounds before = number of\n   calls, rounds after = rounds emitted, rounds per block).\n4. In `codegen.py`, emit `ParallelCalls` as: push all args of all calls in order,\n   `CALL_PARALLEL [(tool, argc), ...]`, then `STORE` each destination in reverse order.\n5. In `vm.py`, run `CALL_PARALLEL` with `concurrent.futures.ThreadPoolExecutor`: check permission\n   for each call, check `calls_used + k \u003c= budget` (E601 at the first call that would exceed),\n   log the calls with the same `round` number in their original order.\n6. In `pipeline.py`, add the `schedule` phase (when `parallel=True`) and the rounds stats; codegen\n   takes the scheduled CFGs.\n7. In `app.js`, fill the Rounds tab and show rounds before/after.\n8. Regenerate goldens, write tests, update docs.\n\n**Tests (`test_scheduler.py`)**: `parallel_demo.as` has rounds 4 -> 2 with the three\n`web_search` calls in round 1; a call using the result of another call stays in a later round;\n`send_email` and `confirm` are never in a round with another call; `delete_file` keeps its order;\n`valid_report.as` keeps 5 rounds; the scheduled program returns the same value as the unscheduled\none; the VM log shows round numbers.\n\n**Docs to update:** `11-parallel-scheduling.md`; `demo-script.md` section \"Parallel rounds\";\n`viva-notes.md` scheduling questions.\n\n**Gate:** `.venv/bin/pytest -q` all pass; `.venv/bin/python -m agentscript compile\nexamples/parallel_demo.as --phase schedule` shows rounds 4 -> 2; docs updated.\n\n### Gate summary\n\n| Milestone | Command | Expected |\n| --- | --- | --- |\n| M1 | `.venv/bin/pytest -q tests/test_lexer.py tests/test_parser.py tests/test_semantic.py tests/test_cli.py` | all pass |\n| M1 | `.venv/bin/python -m agentscript compile examples/valid_report.as --phase symbols` | symbol table, exit 0 |\n| M1 | `.venv/bin/pytest -q tests/test_pipeline.py` | all pass with done set `E101` to `E305` (the 8 front-end error examples give their manifest code, line, col) |\n| M2 | `.venv/bin/pytest -q` | all pass |\n| M2 | `.venv/bin/python -m agentscript run examples/valid_report.as --task report --args '{\"topic\": \"AI safety\"}'` | `true`, 5 calls |\n| M2 | `.venv/bin/python -m agentscript compile examples/sem_budget.as` | `E306 [semantic] 9:12`, exit 1 |\n| M2 | `.venv/bin/python -m agentscript compile examples/runtime_budget.as` | `W306 [semantic] 6:12`, exit 0 |\n| M2 | `.venv/bin/python -m agentscript run examples/runtime_budget.as --task poll --args '{\"topic\": \"news\", \"times\": 5}'` | E601 at 7:15 after 3 calls, exit 1 |\n| M3 | `.venv/bin/python -m agentscript compile examples/optimize_demo.as --phase optimized_ir` | calls 4 -> 2 |\n| M4 | `.venv/bin/python -m agentscript compile examples/taint_injection.as` | E401 at 9:14 with a path, exit 1 |\n| M4 | `.venv/bin/python -m agentscript compile examples/valid_report.as` | exit 0 |\n| M5 | `.venv/bin/python -m agentscript compile examples/valid_cleanup.as` | exit 0 |\n| M5 | `.venv/bin/python -m agentscript compile examples/approval_missing.as` | E501 at 7:14, exit 1 |\n| M5 | `.venv/bin/python -m agentscript compile examples/approval_one_branch.as` | E502 at 9:12, exit 1 |\n| M6 | `.venv/bin/python -m agentscript serve` | full demo in the browser, no terminal |\n| M7 | `.venv/bin/python -m agentscript compile examples/parallel_demo.as --phase schedule` | rounds 4 -> 2 |\n\nEvery row also requires `.venv/bin/pytest -q` (M2 onwards) and the milestone's docs.\n\n---\n\n## 6. Algorithms\n\n### 6.1 IR lowering rules (`irgen.py`)\n\nTemps (`t1, t2, ...`) and labels (`L1, L2, ...`) are numbered per task in creation order. A user\nname already used earlier in the same task (in a sibling scope) is renamed `name.2`, `name.3`, ...,\nso every IR variable except loop counters has exactly one static definition. That property is what\nmakes the approval rule's \"confirm value\" and the optimizer's dead-assignment check simple.\n\n| Source | IR |\n| --- | --- |\n| `let x = \u003ccall \\| binop \\| index>;` | the instruction writes straight into `x` (no extra temp) |\n| `let x = \u003cname \\| literal>;` | `x = \u003coperand>` (Assign) |\n| `e;` (expression statement) | the call's result goes into a fresh temp |\n| `return e;` | lower `e` to an operand `v`; `return v` |\n| `if (c) { A }` | `if c goto Lthen else Lend`; `Lthen:` A; `goto Lend`; `Lend:` |\n| `if (c) { A } else { B }` | `if c goto Lthen else Lelse`; `Lthen:` A; `goto Lend`; `Lelse:` B; `goto Lend`; `Lend:` |\n| `repeat N { A }` | `tK = 0`; `tN = N`; `goto Lhead`; `Lhead:` `tC = tK \u003c tN`; `if tC goto Lbody else Lexit`; `Lbody:` A; `tK = tK + 1`; `goto Lhead`; `Lexit:` |\n\nOperands are lowered left to right, arguments before the call, so the IR call order equals the\nsource evaluation order (the budget path and the call log both rely on this). The then block always\ngets its own label, so it is always its own basic block: that is the block the approval rule\ninspects.\n\n### 6.2 Dominators (iterative, `cfg.py`)\n\n```\nR = reachable(cfg)                         # DFS from entry\ndom[entry] = {entry}\nfor b in R - {entry}: dom[b] = R\nchanged = true\nwhile changed:\n    changed = false\n    for b in R - {entry}, in layout order:\n        new = {b} ∪ ⋂ { dom[p] for p in preds(b) if p in R }\n        if new != dom[b]: dom[b] = new; changed = true\nreturn dom                                 # only reachable blocks are keys (D9)\n```\n\nWhy this algorithm: the CFGs have a handful of blocks, so the simple set-based version is fast\nenough and easy to explain; Lengauer-Tarjan would add complexity for no visible gain.\n\n### 6.3 Taint fixed point with provenance (`taint.py`)\n\nState: a map from variable to its provenance (the list of `PathStep`s from the source call). A\nvariable that is absent is trusted. The join of `trusted` and `untrusted` is `untrusted`.\n\n```\nlabel(op, S)  = S[op.name] if op is Var and op.name in S else None      # None = trusted\n\ntransfer(instr, S):                         # returns the new S\n    case Assign / BinOp / Index:\n        src = first untrusted operand (in operand order), if any\n        if src: S[dst] = S[src] + [step(instr, \"flows into dst\")]\n        else:   remove dst from S\n    case Call with spec = TOOLS[tool]:\n        if spec.untrusted_result: S[dst] = [step(instr, \"untrusted result of tool\")]\n        elif spec.propagates_taint and some arg untrusted:\n            S[dst] = S[that arg] + [step(instr, \"passes through llm\")]\n        else: remove dst from S              # sanitizer and the bool-returning tools: trusted\n    others: no change\n\nIN[b] = {} and OUT[b] = {} for all b  (params trusted)\nrepeat:\n    changed = false\n    for b in blocks in layout order:\n        IN[b] = merge(OUT[p] for p in preds(b))     # union of keys; provenance from the\n                                                    # first predecessor (preds order) that has it\n        OUT[b] = fold transfer over b.instrs starting from IN[b]\n        if the key set of OUT[b] changed: changed = true\nuntil not changed\n\nsink check (layout order, using IN[b] and transfer step by step):\n    for Call c with TOOLS[c.tool].privileged:\n        for arg in c.args: if label(arg) untrusted:\n            raise E401 at c; path = S[arg] + [step(c, \"reaches privileged tool\")]\n```\n\nTermination: the set of untrusted variables per block only grows, and it is bounded by the number\nof variables. No implicit flows: `Branch` conditions never taint anything (D6).\n\n### 6.4 Worst-path budget count (`semantic.py`)\n\nWorks on the AST, before IR, because budget is a semantic-analysis check (PRD phase table).\n\n```\ncalls(expr):                                  # call sites in evaluation order\n    Call:   concat(calls(a) for a in args) + [(tool, line, col)]\n    Binary: calls(left) + calls(right)\n    Index:  calls(base) + calls(index)\n    other:  []\n\nworst(stmts):\n    path = []\n    for s in stmts:\n        Let / Return / ExprStmt: path += calls(s's expression)\n        If:     t = worst(then); e = worst(else) or []\n                path += calls(cond) + (t if len(t) >= len(e) else e)\n        Repeat INT n: path += worst(body) * max(n, 0)\n        Repeat Name x: path += worst(body); warn W306 at x\n    return path\n\nper task: p = worst(body.statements)\n    if len(p) > budget: raise E306 at p[budget]   # the (budget+1)-th call\n                        message: task name, len(p), budget; path = p\n```\n\nEarly returns are ignored, so the count is an upper bound (conservative). For `repeat x` the VM\nenforces the budget (E601). Check on `valid_report.as`: web_search, sanitize, llm, confirm (the\n`if` condition), send_email (then branch) = 5, equal to the budget, so it passes.\n\n### 6.5 Approval check (`approval.py`)\n\n```\nCV = {v | the only definitions of v are Call confirm, or Assign v = w with w in CV}   # iterate\nG  = [b.if_true for b in blocks (layout order) if b.terminator is Branch(cond=Var v), v in CV]\ndom = dominators(cfg); R = reachable(cfg)\nC  = {blocks containing a Call to confirm}\n\nfor b in blocks in layout order, b in R:\n    for Call c in b with TOOLS[c.tool].irreversible:\n        if any(g in dom[b] for g in G): continue                 # guarded\n        code = E502 if any(b in reach_from(k) for k in C) else E501   # k reaches itself\n        p = bfs_path(entry, b, avoid=set(G))\n        if p is None: p = bfs_path(entry, b, avoid={G[0]})       # exists: G[0] does not dominate b\n        raise code at c; path = steps(p) + [step(c, \"irreversible call\")]\n\nbfs_path(start, target, avoid):\n    standard BFS over succs (in succs order, so the path is deterministic), never entering\n    a block in avoid; returns the block list or None.\nsteps(p): one PathStep per block on the path, at its first instruction, with a note naming the\n    edge taken (for example which side of which `if` condition).\n```\n\nWhy the true successor and not the `confirm` call: `confirm` can return `false`. Dominance by the\ncall only proves the question was asked; dominance by the true edge proves the human said yes.\n\n### 6.6 Optimizations (`optimizer.py`)\n\nDriver: `cfg = deepcopy(input)`; repeat the four passes until none reports a change.\n\n**Part 1: constant folding, local propagation, branch folding (per block)**\n\n```\nenv = {}                                     # var -> Const or Var, valid inside this block only\nfor instr in block.instrs:\n    replace each Var operand v by env[v] if v in env\n    if BinOp with two Const operands: instr = Assign(dst, Const(eval(op, l, r)))\n    if Branch with Const cond: instr = Jump(if_true if cond else if_false); fix succs/preds\n    if instr defines d: drop every env entry whose key or value is d\n    if Assign(dst, src): env[dst] = src\n```\n\nOnly within a block, because a block can be entered from several predecessors; cross-block\npropagation would need a full data-flow pass for little gain in these programs.\n\n**Part 2: unreachable blocks and dead assignments**\n\n```\nremove every block not in reachable(cfg); drop it from the preds of the rest\nused = {all used_vars(i) for every instruction in the task}\nremove Assign / BinOp whose dst not in used          # never Call (side effects, budget)\n                                                     # never Index (may raise E603)\n```\n\n**Part 3: duplicate tool-call elimination (per block)**\n\n```\nprev = None\nfor i, instr in enumerate(block.instrs):\n    if instr is Call:\n        if prev and prev.tool == instr.tool and TOOLS[instr.tool].mergeable\n           and prev.args == instr.args\n           and no instruction between them redefines prev.dst or a Var in prev.args:\n            block.instrs[i] = Assign(instr.dst, prev.dst)       # prev stays the reference call\n        else:\n            prev = instr\n```\n\nSafety restrictions: only `mergeable` (read-only) tools, so `send_email`, `delete_file` and\n`confirm` are never merged; same block and no other call in between, so no side effect can change\nthe answer between the two calls. Merging only lowers the runtime call count, so the static budget\nproven before optimization still holds.\n\nReport: instruction count (non-label) and call count before and after, and a list of changes.\n\n### 6.7 List scheduler (M7, `scheduler.py`)\n\n```\nfor each block:\n    body = block.instrs[:-1]; term = block.instrs[-1]\n    deps = build_deps(body)              # RAW, WAR, WAW; call-call edge if either is a barrier\n    out = []; done = set()\n    while len(done) \u003c len(body):\n        loop: emit every ready non-call (deps all done) in original order, until none is ready\n        ready_calls = ready calls in original order\n        if len(ready_calls) >= 2: out.append(ParallelCalls(ready_calls))\n        elif ready_calls:       out.append(ready_calls[0])\n        mark them done\n    out.append(term)\nrounds_before = count_calls; rounds_after = number of call rounds emitted\n```\n\nBarrier tools (`privileged`, `irreversible`, `approval`) keep their order relative to every other\ncall (L3), and data dependencies always hold, so the visible order of side effects never changes.\n\n### 6.8 VM loop (`vm.py`)\n\n```\nvalidate(task, args)                       # E604\nenv = dict(args); stack = []; pc = 0; calls_used = 0\nwhile true:\n    ins = code[pc]; pc += 1\n    PUSH_CONST/LOAD/STORE/arith/compare: as in 4.8\n    INDEX: i = pop; xs = pop; if not 0 \u003c= i \u003c len(xs): E603 at ins; push xs[i]\n    CALL:  if tool not in permits: E602;  if calls_used + 1 > budget: E601\n           args = pop argc values; result = registry.call(tool, args); calls_used += 1; log; push\n    JUMP a: pc = a;   JUMP_IF_FALSE a: if not pop: pc = a\n    RETURN: return RunResult(pop, log, calls_used, budget, rounds)\n```\n\n### 6.9 Code generation templates (`codegen.py`)\n\n| IR | Bytecode |\n| --- | --- |\n| `x = y` | push y; `STORE x` |\n| `x = a op b` | push a; push b; `ADD`/`SUB`/... (from `BINARY_OPS`); `STORE x` |\n| `x = xs[i]` | push xs; push i; `INDEX`; `STORE x` |\n| `x = call t(a1..an)` | push a1 .. an; `CALL t n`; `STORE x` |\n| `goto L` | `JUMP addr(L)`, omitted when L is the next block |\n| `if c goto T else F` | push c; `JUMP_IF_FALSE addr(F)`; `JUMP addr(T)`, the JUMP omitted when T is the next block |\n| `return v` | push v; `RETURN` |\n| `round {...}` (M7) | push all args in order; `CALL_PARALLEL [(t, n), ...]`; `STORE` each dst in reverse order |\n\n\"push\" is `PUSH_CONST v` for a `Const` and `LOAD name` for a `Var`. Every `BInstr` copies the IR\ninstruction's `line`/`col`, so runtime errors point at source.\n\n---\n\n## 7. Demo programs\n\nThe files already exist under `examples/`, and `examples/manifest.json` records each one's\nexpected result. They are not copied here, so there is one source of truth. Line:col values below\nare from the manifest.\n\n| File | Purpose | Expected result (code, line:col) | Run args |\n| --- | --- | --- | --- |\n| `valid_report.as` | The PRD example: search, sanitize, summarize, confirm, email; exactly 5 calls | compiles | `report`, `{\"topic\": \"AI safety\"}`, returns `true` |\n| `valid_cleanup.as` | `delete_file` guarded by `let ok = confirm(..); if (ok)` | compiles | `cleanup`, `{\"path\": \"/tmp/old.log\"}` |\n| `optimize_demo.as` | Folding removes the debug branch, duplicate `web_search` merged: 4 calls -> 2 | compiles | `research`, `{\"topic\": \"compilers\"}` |\n| `parallel_demo.as` | M7: three independent searches in one round: 4 rounds -> 2 | compiles | `scout`, `{\"a\": \"rust\", \"b\": \"go\", \"c\": \"zig\"}` |\n| `lex_unterminated.as` | Error 1: string never closes | E101 lexer 6:13 | - |\n| `lex_illegal_char.as` | Error 1: `#` is not in the language | E102 lexer 6:15 | - |\n| `syntax_missing_semicolon.as` | Error 2: `let` without `;` | E201 parser 6:30 | - |\n| `sem_undeclared.as` | Error 3: `return x;` with no `x` | E301 semantic 6:12 | - |\n| `sem_duplicate.as` | Error 3: `let a` twice | E302 semantic 7:9 | - |\n| `sem_type_mismatch.as` | Error 4: `web_search(42)` | E303 semantic 6:23 | - |\n| `sem_missing_return.as` | Error 4: no return when `flag` is false | E304 semantic 9:3 | - |\n| `sem_not_permitted.as` | Error 5: `read_file` without `permit read_file` | E305 semantic 6:16 | - |\n| `sem_budget.as` | Error 6: four calls with `budget calls = 3` | E306 semantic 9:12 | - |\n| `taint_injection.as` | Error 7: the PRD example without `sanitize` | E401 taint 9:14 | - |\n| `approval_missing.as` | Error 8: `delete_file` on a path that skips `confirm` | E501 approval 7:14 | - |\n| `approval_one_branch.as` | Error 9: `confirm` only inside one branch, delete after it | E502 approval 9:12 | - |\n| `runtime_budget.as` | Error 10: `repeat times` warns, VM guard trips at the 4th call | W306 semantic 6:12; run E601 runtime 7:15 | `poll`, `{\"topic\": \"news\", \"times\": 5}` |\n| `runtime_index.as` | Runtime: `results[9]` on a 3-element list | run E603 runtime 7:19 | `tenth`, `{\"topic\": \"AI\"}` |\n\nThat is 14 failing programs with 14 distinct codes (E101, E102, E201, E301, E302, E303, E304, E305,\nE306, E401, E501, E502, E601, E603), against the PRD target of at least 8. E602 (unreachable from\ncompiled code) is shown by a unit test with hand-made bytecode, and E604 by API and VM tests.\n\n---\n\n## 8. API contract (`api.py`)\n\n**`POST /compile`**\n\nRequest: `{\"source\": \"...\"}`. Response (`CompileResult.to_dict()`):\n\n```json\n{\"ok\": true,\n \"diagnostics\": [],\n \"warnings_count\": 0,\n \"phases\": {\"tokens\": {\"text\": \"...\", \"data\": []}, \"ast\": {\"text\": \"...\", \"data\": {}},\n            \"symbols\": {}, \"ir\": {}, \"cfg\": {}, \"taint\": {}, \"approval\": {},\n            \"optimized_ir\": {}, \"schedule\": {}, \"bytecode\": {}},\n \"stats\": {\"before\": {\"instructions\": 14, \"calls\": 5}, \"after\": {\"instructions\": 14, \"calls\": 5},\n           \"rounds_before\": 5, \"rounds_after\": 5},\n \"tasks\": [{\"name\": \"report\", \"params\": [{\"name\": \"topic\", \"type\": \"string\"}], \"return_type\": \"bool\"}]}\n```\n\n`diagnostics` holds the warnings and at most one error (Diagnostic JSON, 4.9). Phases after the\nfailing one are `null`; `ok` is `false` when there is an error. (The numbers above show the shape\nonly.)\n\n**`POST /run`**\n\nRequest: `{\"source\": \"...\", \"task\": \"report\", \"args\": {\"topic\": \"AI safety\"}, \"live\": false,\n\"confirm\": true}`. Response:\n\n```json\n{\"ok\": true, \"diagnostics\": [], \"value\": true,\n \"calls\": [{\"n\": 1, \"tool\": \"web_search\", \"args\": [\"AI safety\"], \"result\": [\"...\"],\n            \"line\": 6, \"round\": 1, \"note\": null}],\n \"calls_used\": 5, \"budget\": 5, \"rounds\": 5}\n```\n\nOn a compile error: `ok: false`, the compile diagnostics, `value: null`, `calls: []`. On a runtime\nerror: `ok: false`, the runtime diagnostic, and the calls made before it.\n\n**`GET /examples`**\n\n```json\n[{\"file\": \"valid_report.as\", \"title\": \"...\", \"description\": \"...\", \"expect\": null,\n  \"run\": {\"task\": \"report\", \"args\": {\"topic\": \"AI safety\"}}, \"source\": \"...\"}]\n```\n\nBuilt from `examples/manifest.json` plus each file's source. `expect` is\n`{\"code\", \"phase\", \"line\", \"col\"}` or `null`.\n\nJSON-to-type mapping for run arguments: `string` \u003c-> str, `int` \u003c-> int (not bool), `bool` \u003c->\nbool, `list\u003cT>` \u003c-> array of T. Anything else is E604.\n\n---\n\n## 9. Requirements traceability\n\n### PRD requirements\n\n| Requirement | Milestone | Code | Tests |\n| --- | --- | --- | --- |\n| F1 lexer with line/col, E101, E102 | M1 | `lexer.py` | `test_lexer.py`; `test_pipeline.py` (lex examples) |\n| F2 recursive-descent parser from the grammar, E201 with location | M1 | `parser.py` | `test_parser.py`; `test_pipeline.py` |\n| F3 nested scopes, E301, E302 | M1 | `semantic.py` (`Scope`, `Symbol`) | `test_semantic.py`; `sem_undeclared.as`, `sem_duplicate.as` |\n| F4 type checker (expressions, arguments, returns, conditions), E303, E304 | M1 | `semantic.py` | `test_semantic.py`; `sem_type_mismatch.as`, `sem_missing_return.as` |\n| F5 permission check E305; VM guard E602 | M1 (E305), M2 (E602) | `semantic.py`, `vm.py` | `test_semantic.py`, `test_vm.py` (hand-made bytecode); `sem_not_permitted.as` |\n| F6 static worst-path budget E306, W306; VM guard E601 | M2 | `semantic.py`, `vm.py` | `test_semantic.py`, `test_vm.py`; `sem_budget.as`, `runtime_budget.as` |\n| F7 three-address code, basic blocks, CFG | M2 | `irgen.py`, `cfg.py`, `ir.py` | `test_irgen.py`, `test_cfg.py`, `test_golden.py` |\n| F8 constant folding, dead code, duplicate calls | M3 | `optimizer.py` | `test_optimizer.py`; `optimize_demo.as` |\n| F9 bytecode, stack VM, registry (mock default, `--live`) | M2 | `codegen.py`, `bytecode.py`, `vm.py`, `registry.py` | `test_codegen.py`, `test_vm.py`, `test_registry.py`, `test_cli.py` |\n| T1 tools declare untrusted results and privileged sinks (built-in table) | M4 (table given) | `tools.py`, `taint.py` | `test_taint.py` |\n| T2 propagation through assignment, concatenation, indexing, `llm` | M4 | `taint.py` | `test_taint.py` |\n| T3 `sanitize` clears taint | M4 | `taint.py`, `tools.py` | `test_taint.py`; `valid_report.as` |\n| T4 E401 naming source line, sink line and the path | M4 | `taint.py`, `diagnostics.py` | `test_taint.py`; `taint_injection.as` |\n| A1 irreversible tools (built-in table) | M5 (table given) | `tools.py`, `approval.py` | `test_approval.py` |\n| A2 dominator-based confirm guard rule | M5 | `cfg.py` (`dominators`), `approval.py` | `test_cfg.py`, `test_approval.py`; `valid_cleanup.as` |\n| A3 violation shows one offending path, E501/E502 | M5 | `approval.py` | `test_approval.py`; `approval_missing.as`, `approval_one_branch.as` |\n| L1 dependency graph, parallel rounds | M7 | `scheduler.py` | `test_scheduler.py`; `parallel_demo.as` |\n| L2 VM runs rounds concurrently; editor shows rounds before/after | M7 | `vm.py`, `pipeline.py`, `web/app.js` | `test_vm.py`, `test_scheduler.py` |\n| L3 no reordering across data dependencies or barrier tools | M7 | `scheduler.py` | `test_scheduler.py` |\n\n### Editor requirements\n\n| Requirement | Milestone | Code | Tests |\n| --- | --- | --- | --- |\n| Code pane with AgentScript highlighting | M6 | `web/app.js`, `web/index.html` | manual (M6 gate, demo script) |\n| Inline error squiggles from diagnostics | M6 | `web/app.js` | `test_api.py` (diagnostic shape); manual |\n| Phase tabs: Tokens, AST, Symbols, Errors, IR, CFG, Taint, Approval, Optimized IR, Rounds, Bytecode, Output | M6 (Rounds at M7) | `pipeline.py`, `web/app.js` | `test_api.py` (every phase key present); manual |\n| CFG view (Mermaid) | M6 | `cfg.py` (`cfg_to_mermaid`), `pipeline.py`, `web/app.js` | `test_api.py` (cfg `data` has `mermaid`); manual |\n| Taint view: untrusted values highlighted, path on error | M6 | `taint.py` (data), `web/app.js` | `test_api.py` (E401 path); manual |\n| Approval view: guard blocks and checked irreversible calls, offending path on error | M6 | `approval.py` (artifact), `web/app.js` | `test_api.py` (E501/E502 diagnostic with `path`); manual |\n| Optimization view: instruction and call counts before/after | M6 | `optimizer.py`, `pipeline.py` (`stats`), `web/app.js` | `test_optimizer.py`, `test_api.py` |\n| Run panel: call log, budget used, live toggle | M6 | `api.py`, `vm.py`, `web/app.js` | `test_api.py` (`/run`); manual |\n| Example picker: valid program + one failing program per error type | M6 | `api.py` (`/examples`), `examples/manifest.json` | `test_api.py`; `test_pipeline.py` |\n| Backend `POST /compile`, `POST /run` | M6 | `api.py` | `test_api.py` |\n\n### Success metrics\n\n| Metric | Milestone | Code | Test or check |\n| --- | --- | --- | --- |\n| 6 of 6 classic phases implemented and visible in the editor (D27) | M1 to M3, shown at M6 | `lexer.py`, `parser.py`, `semantic.py`, `irgen.py`, `optimizer.py`, `codegen.py`, `web/` | `test_api.py` (phase keys); M6 gate |\n| At least 8 distinct error types, each with its own failing program (14 delivered) | M1, M2, M4, M5 | `examples/`, `manifest.json` | `test_pipeline.py` over the manifest |\n| Injection example rejected at compile time | M4 | `taint.py` | `test_taint.py`, `test_pipeline.py` (`taint_injection.as`) |\n| Unapproved irreversible call rejected at compile time | M5 | `approval.py` | `test_approval.py`, `test_pipeline.py` (`approval_missing.as`) |\n| Optimizer demo: duplicate call removed, counts before and after shown | M3, shown at M6 | `optimizer.py`, `web/app.js` | `test_optimizer.py` (4 -> 2); M3 gate |\n| Stretch: 3 independent calls in 1 round | M7 | `scheduler.py`, `vm.py` | `test_scheduler.py` (`parallel_demo.as`, 4 -> 2) |\n\n### PRD test approach\n\n| Test approach item | Where |\n| --- | --- |\n| Unit tests per phase | `test_lexer.py` ... `test_scheduler.py` |\n| Golden tests per demo program and phase | `test_golden.py`, `tests/golden/*.json`, `tests/update_golden.py` (from M2) |\n| Negative tests with the right code and line | `test_pipeline.py` over `examples/manifest.json` |\n| Optimizer count tests | `test_optimizer.py` |\n\n---\n\n## 10. Out of scope\n\nDo not add any of these. They are left out on purpose to keep the language and the compiler small\nenough to finish and explain.\n\n| Left out | Why |\n| --- | --- |\n| `else if` chains | Nest an `if` inside `else` instead; one form keeps the grammar and CFG small. |\n| Assignment statements, mutable variables | Single definitions make taint, approval and optimization simpler to state and prove. |\n| `!`, `&&`, `\\|\\|`, `/`, `%`, unary minus | Not needed by any example; `/` would add division by zero. |\n| List literals, maps, records, other types | Lists only come from `web_search`; four types are enough. |\n| User functions, task-to-task calls, recursion | Each task is one CFG; no interprocedural analysis. |\n| More than one agent per file, imports, modules | One file, one agent. |\n| User-declared tools or annotations | The tool table is fixed (D1). |\n| Loops other than `repeat N` (`while`, `for`, `break`) | `repeat` is enough to demonstrate error #10. |\n| Implicit-flow taint, per-element list taint | Documented limitations (D6). |\n| Parser error recovery, multiple errors per run | First error only (D14). |\n| Language Server Protocol, VS Code extension | Optional future work in the PRD. |\n| Database, user accounts, saved programs | Not needed for the demo. |\n| Frontend frameworks or build tooling (React, npm, bundlers) | One static page (Step 0 answer). |\n| Real email sending, real file deletion | Always simulated, even with `--live` (D18). |\n| A hardened sandbox, production use, soundness proof | PRD non-goals. |\n| Cross-block constant propagation, SSA, register allocation | Not required by F8; local passes are enough for the demo. |\n"}, {"id": "how-it-works--02-lexer", "path": "docs/how-it-works/02-lexer.md", "group": "How it works", "title": "02. Lexer (lexical analysis)", "nav": "Lexer", "md": "# 02. Lexer (lexical analysis)\n\n## 1. What this phase does\n\n| | |\n| --- | --- |\n| Input | The source text of one `.as` file, as a string. |\n| Output | A list of tokens, each with its kind, its exact text and its 1-based line and column. The last token is always `EOF`. Also a `{text, data}` artifact for the Tokens tab. |\n| Place in the pipeline | Stage 1 of 10, the first of the six classic phases. Its tokens go to the parser (stage 2). |\n| Errors | E101 unterminated string, E102 illegal character. The first lexical error stops compilation. |\n\nThe lexer turns characters into words. It removes whitespace and comments, recognises\nkeywords, identifiers, integer and string literals, and operators, and records where each one\nstarts so that every later error message can point at a line and column.\n\n## 2. Key data structures\n\n**Token.** One record per token:\n\n| Field | Meaning |\n| --- | --- |\n| `kind` | A `TokenKind` value (see below). |\n| `text` | The exact characters from the source, e.g. `web_search`, `\u003c=`, `\"Send report?\"` (with the quotes and any backslashes). `\"\"` for `EOF`. |\n| `value` | `int` for `INT`, the unescaped `str` for `STRING`, `None` for every other kind. |\n| `line`, `col` | Position of the token's first character. 1-based; a tab counts as one column. |\n\nFor a string literal `value` is the unescaped string (the characters between the quotes with\nescapes resolved), which the parser copies into `StrLit.value`. For an integer literal the\nlexer already converts the digits to a Python `int`, which the parser copies into\n`IntLit.value` (and `Budget.calls`).\n\nWhy keep the raw `text`: the parser's error-location rule for E201 needs the length of the\nprevious token as it appears in the source (`prev.col + len(prev.text)`), and the Tokens tab\nshould show what the user typed.\n\n**TokenKind.** The exact enum members are defined in `agentscript/lexer.py` and listed in the\nimplementation plan. They fall into these groups:\n\n| Group | Members |\n| --- | --- |\n| Keywords | `agent permit budget calls task let if else repeat return true false string int bool list` |\n| Identifier | `IDENT`: `[A-Za-z_][A-Za-z0-9_]*` that is not a keyword |\n| Literals | `INT`: `[0-9]+`; `STRING`: `\"...\"` on one line |\n| Punctuation | `{ } ( ) [ ] , ; : = ->` |\n| Operators | `+ - * == != \u003c \u003c= > >=` |\n| End | `EOF` |\n\nEach keyword, punctuation and operator member has its spelling as its enum value (for example\n`TokenKind.ARROW.value == \"->\"`). Most keyword members are the upper-cased spelling (`AGENT`,\n`LET`, `FALSE`, ...); the four type keywords are `STRING_T`, `INT_T`, `BOOL_T` and `LIST_T`, so\nthey do not clash with the literal kinds `STRING` and `INT`. Punctuation and operators have\nnames such as `LBRACE`, `SEMI`, `ASSIGN`, `ARROW`, `PLUS`, `EQ`, `LE`, `GT`.\n\n**Keyword set.** `KEYWORDS`, a dict from the 16 keyword spellings to their kinds, built from the\nenum. An identifier-shaped word is looked up in it after it has been scanned; if found, it gets\nthe keyword's kind instead of `IDENT`.\n\n## 3. Algorithm\n\nIn plain words: walk through the source one character at a time, keeping a position, a line and\na column. At each step skip whitespace and `//` comments; then look at the current character to\ndecide what kind of token starts here, and consume the longest sequence of characters that\nstill forms a token of that kind (maximal munch). Record the token with the line and column\nwhere it started. Newlines increase the line and reset the column to 1. At the end, append\n`EOF`. The whole file is tokenized before parsing starts.\n\nRecognition rules, in the order they are tried:\n\n| Current character | Action |\n| --- | --- |\n| space, tab, `\\r`, `\\n` | skip (a `\\n` starts a new line) |\n| `/` followed by `/` | skip to the end of the line (comment) |\n| letter or `_` | read `[A-Za-z0-9_]*`; keyword if in the keyword set, otherwise `IDENT` |\n| digit | read `[0-9]+`: `INT` |\n| `\"` | read a string literal (below) |\n| one of `- = ! \u003c >` that can start a two-character operator | try `->`, `==`, `!=`, `\u003c=`, `>=` first, then the one-character form |\n| one of `{ } ( ) [ ] , ; : + - * \u003c > =` | one-character token |\n| anything else (including `!` alone and `/` alone) | E102 at this character |\n\nString literals: after the opening quote, read characters until the closing quote. A backslash\ntakes the next character: `\\n` becomes a newline, `\\t` a tab, `\\\"` a quote, `\\\\` a backslash, and\na backslash before any other character yields that character. A newline or the end of the file\nbefore the closing quote is E101, reported at the **opening** quote (a backslash directly before\nthe newline or the end of the file does not help: it is still E101). Any character is allowed\ninside a string except a lone UTF-16 surrogate (`\\ud800` to `\\udfff`, which can reach the\ncompiler through the JSON API), which is E102 at that character because it cannot be encoded\nas UTF-8 in any artifact.\n\n```\ntokenize(src):\n    tokens = []; i = 0; line = 1; col = 1\n    while i \u003c len(src):\n        c = src[i]\n        if c is whitespace:            advance(1); continue      # advance() updates line/col\n        if src[i:i+2] == \"//\":         skip to \"\\n\"; continue\n        start = (line, col)\n        if c is letter or \"_\":         word = read [A-Za-z0-9_]*\n                                       kind = KEYWORDS.get(word, IDENT)\n        elif c is digit:               word = read [0-9]+; kind = INT\n        elif c == '\"':                 word, value = read_string(start)   # E101 at start\n                                       kind = STRING\n        elif src[i:i+2] in TWO_CHAR:   word = src[i:i+2]; kind = TWO_CHAR[word]\n        elif c in ONE_CHAR:            word = c; kind = ONE_CHAR[c]\n        else:                          raise E102 \"illegal character c\" at start\n        tokens.append(Token(kind, word, value, *start))  # value: int, unescaped str, or None\n    tokens.append(Token(EOF, \"\", None, line, col))\n    return tokens\n```\n\n`TWO_CHAR` is `-> == != \u003c= >=`; `ONE_CHAR` is `{ } ( ) [ ] , ; : = + - * \u003c >`. Because `>>` is in\nneither table, `list\u003clist\u003cstring>>` ends with two separate `>` tokens, which is exactly what the\nparser's `type` rule needs.\n\n## 4. Worked example\n\nInput, `examples/valid_report.as` (with line numbers):\n\n```\n     1\tagent Assistant {\n     2\t  permit web_search, llm, sanitize, send_email, confirm;\n     3\t  budget calls = 5;\n     4\t\n     5\t  task report(topic: string) -> bool {\n     6\t    let raw = web_search(topic);\n     7\t    let clean = sanitize(raw[0]);\n     8\t    let summary = llm(\"Summarize: \" + clean);\n     9\t    if (confirm(\"Send report?\")) {\n    10\t      return send_email(\"me@example.com\", summary);\n    11\t    }\n    12\t    return false;\n    13\t  }\n    14\t}\n```\n\nOutput of `.venv/bin/python -m agentscript compile examples/valid_report.as --phase tokens`\n(each line is `line:col`, the `TokenKind` name, then the raw text):\n\n```\n  1:1   AGENT      agent\n  1:7   IDENT      Assistant\n  1:17  LBRACE     {\n  2:3   PERMIT     permit\n  2:10  IDENT      web_search\n  2:20  COMMA      ,\n...\n  3:3   BUDGET     budget\n  3:10  CALLS      calls\n  3:16  ASSIGN     =\n  3:18  INT        5\n  3:19  SEMI       ;\n  5:3   TASK       task\n  5:8   IDENT      report\n  5:14  LPAREN     (\n  5:15  IDENT      topic\n  5:20  COLON      :\n  5:22  STRING_T   string\n  5:28  RPAREN     )\n  5:30  ARROW      ->\n  5:33  BOOL_T     bool\n  5:38  LBRACE     {\n  6:5   LET        let\n  6:9   IDENT      raw\n  6:13  ASSIGN     =\n  6:15  IDENT      web_search\n  6:25  LPAREN     (\n  6:26  IDENT      topic\n  6:31  RPAREN     )\n  6:32  SEMI       ;\n  7:5   LET        let\n  7:9   IDENT      clean\n  7:15  ASSIGN     =\n  7:17  IDENT      sanitize\n  7:25  LPAREN     (\n  7:26  IDENT      raw\n  7:29  LBRACKET   [\n  7:30  INT        0\n  7:31  RBRACKET   ]\n  7:32  RPAREN     )\n  7:33  SEMI       ;\n  8:5   LET        let\n  8:9   IDENT      summary\n  8:17  ASSIGN     =\n  8:19  IDENT      llm\n  8:22  LPAREN     (\n  8:23  STRING     \"Summarize: \"\n  8:37  PLUS       +\n  8:39  IDENT      clean\n  8:44  RPAREN     )\n  8:45  SEMI       ;\n...\n 12:5   RETURN     return\n 12:12  FALSE      false\n 12:17  SEMI       ;\n 13:3   RBRACE     }\n 14:1   RBRACE     }\n 15:1   EOF\n```\n\nWhat to notice:\n\n- **Keyword or identifier.** `let`, `task`, `string`, `bool`, `false` are scanned exactly like\n  identifiers and then found in `KEYWORDS`, so they get their own kinds (`LET`, `TASK`,\n  `STRING_T`, `BOOL_T`, `FALSE`). `raw`, `topic`, `report` are not keywords and become `IDENT`.\n  Tool names are not keywords either: `web_search`, `sanitize` and `llm` are plain `IDENT`s;\n  that they name tools is decided later, by the parser (an `IDENT` followed by `(`) and the\n  semantic checker.\n- **Positions.** `web_search` on line 6 starts at **6:15**: four spaces of indentation, `let`\n  at 6:5, `raw` at 6:9, `=` at 6:13, then `web_search`. Its `(` is at 6:25 because the\n  identifier is 10 characters long. Every later phase that talks about this call (types,\n  taint, budget) reports 6:15.\n- **Longest match.** `->` on line 5 is one `ARROW` token, not `MINUS` followed by `GT`.\n- **Strings keep their quotes.** `\"Summarize: \"` is shown with its quotes and is 13 characters\n  wide, which is why the `+` after it sits at 8:37 (8:23 + 13 + one space). The unescaped value\n  `Summarize: ` is in the token's `value` field (the `data` part of the artifact).\n- **Whitespace leaves no trace.** Line 4 is empty and there is no token for it; a `//` comment\n  would be skipped the same way.\n- **EOF** sits just after the last character: the file ends with a newline after the `}` on\n  line 14, so `EOF` is at 15:1.\n\n## 5. Errors this phase catches\n\n| Code | Demo file (`examples/manifest.json`) | Expected location |\n| --- | --- | --- |\n| E101 unterminated string | `lex_unterminated.as` | 6:13 |\n| E102 illegal character | `lex_illegal_char.as` | 6:15 |\n\n**E101.** Line 6 of `examples/lex_unterminated.as` opens a string that never closes:\n\n```\n     5\t  task greet() -> string {\n     6\t    let s = \"abc;\n     7\t    return s;\n```\n\n`.venv/bin/python -m agentscript compile examples/lex_unterminated.as` prints:\n\n```\n== diagnostics ==\nE101 [lexer] 6:13: unterminated string: missing closing '\"' before end of line\ncompilation failed\n```\n\n6:13 is the opening `\"`, not the end of the line. The `;` is swallowed into the string, which\nis why the error is lexical and not a missing-semicolon E201.\n\n**E102.** Line 6 of `examples/lex_illegal_char.as` uses `#`, which is not a character of the\nlanguage:\n\n```\n     5\t  task count() -> int {\n     6\t    let n = 2 # 3;\n     7\t    return n;\n```\n\n`.venv/bin/python -m agentscript compile examples/lex_illegal_char.as` prints:\n\n```\n== diagnostics ==\nE102 [lexer] 6:15: illegal character '#'\ncompilation failed\n```\n\nIn both cases no tokens listing is printed: the lexer stops at the first error, so there is no\ncomplete token stream and no later phase runs. The same E102 message is used for `!` without\n`=`, a single `/`, and any non-ASCII letter outside a string or comment.\n\n## 6. Design decisions and limitations\n\n| Decision | Why |\n| --- | --- |\n| Hand-written scanner loop rather than a lexer generator. | The token set is tiny, Python has no standard lex, and a loop makes line/column tracking and the E101 position explicit and easy to explain. (A regex alternation would also work.) |\n| Tokenize the whole file before parsing. | The parser can then peek at any token, the Tokens tab shows the complete stream, and the lexer and parser can be tested separately. |\n| Stop at the first lexical error. | Same policy as every other phase: one error, reported precisely. A wrong character usually makes later tokens meaningless anyway. |\n| E101 points at the opening quote. | That is where the user has to look; the end of the line says nothing about which string is unclosed. |\n| Strings stay on one line. | An unterminated string is then caught on the line where it starts instead of swallowing the rest of the file. |\n| No negative literals, no `/`, no `!`. | The grammar does not have unary minus, division or logical not, so the lexer rejects their characters early with a clear E102 instead of letting the parser produce a vaguer E201. |\n| `>>` is two tokens. | No shift operator exists, and nested list types need two closing `>`. |\n| A tab counts as one column. | Columns then match character offsets in the line, which is what the editor uses for squiggles. Editors that render a tab wider will show a different visual column; this is accepted. |\n\nLimitations:\n\n- `123abc` lexes as `INT 123` followed by `IDENT abc`; the parser then reports E201. The lexer\n  does not require a separator after a number.\n- The language defines no size limit for integer literals; values are Python integers, so there\n  is no overflow check anywhere in the pipeline.\n- Only ASCII letters, digits and `_` are allowed in identifiers. Any other character outside a\n  string or comment is E102.\n- Only the first lexical error is reported.\n\n## 7. Where it lives in the code\n\n**`agentscript/lexer.py`**\n\n| Name | What it is |\n| --- | --- |\n| `TokenKind` | `Enum` of all token kinds; fixed-spelling kinds have their spelling as value, `IDENT`, `INT`, `STRING`, `EOF` have placeholder values (`\"\u003cident>\"`, ...). |\n| `KEYWORDS` | dict spelling to `TokenKind` for the 16 keywords, derived from the enum. |\n| `_TWO_CHAR`, `_ONE_CHAR` | operator and punctuation tables, also derived from the enum; two-character forms are tried first. |\n| `Token` | frozen dataclass `(kind, text, value, line, col)` with `to_dict()` for the JSON artifact. |\n| `_Lexer` | the scanner. `run()` is the main loop; `peek()`, `advance()` (updates line and column), `emit()`; one method per token class: `skip_comment()`, `lex_word()`, `lex_int()`, `lex_string()` (escapes, E101, surrogate E102), `lex_operator()` (longest match, E102). |\n| `tokenize(source)` | public entry point: returns the token list ending in `EOF`, or raises `CompileError` (E101/E102, built with `diagnostics.make_error`). |\n| `format_token(tok)` | one listing line, e.g. `  6:5   LET        let`. |\n| `tokens_artifact(tokens)` | the `tokens` phase artifact: `{\"text\": listing, \"data\": [token dicts]}`. |\n\n**`agentscript/pipeline.py`** runs the lexer as the first stage of `_run_stages()`:\n`res.tokens = tokenize(self.source)` and `phases[\"tokens\"] = tokens_artifact(res.tokens)`. A\nraised `CompileError` becomes the single error diagnostic with phase `lexer`.\n\n**`tests/test_lexer.py`** covers every keyword, operator and punctuation token, longest match\nand `>>`, 1-based positions (including `\\r` and tabs), comments, string escapes, E101 and E102\npositions, the surrogate cases, the artifact format, and checks every example in\n`examples/manifest.json` (`test_examples_lex_per_manifest`): lexer-phase examples must fail with\nthe expected code and position, all others must lex cleanly.\n"}, {"id": "how-it-works--03-parser", "path": "docs/how-it-works/03-parser.md", "group": "How it works", "title": "03. Parser (syntax analysis)", "nav": "Parser", "md": "# 03. Parser (syntax analysis)\n\n## 1. What this phase does\n\n| | |\n| --- | --- |\n| Input | The token list from the lexer, ending in `EOF`. |\n| Output | The abstract syntax tree (AST): one `Agent` node at the root. Also a `{text, data}` artifact for the AST tab (an indented tree as text, the node dictionaries as data). |\n| Place in the pipeline | Stage 2 of 10, the second classic phase. The AST goes to semantic analysis (stage 3), which fills in each expression's type. |\n| Errors | E201 \"expected X, found Y\", including \"expected at most 1000 levels of nesting\" for programs nested too deeply. Only the first syntax error is reported; there is no error recovery. |\n\nThe parser checks that the tokens follow the grammar and builds a tree that later phases can\nwalk without caring about punctuation, precedence or parentheses.\n\n## 2. Key data structures\n\n**The grammar** (complete; repeated from [01-language.md](01-language.md)):\n\n```\nprogram      = \"agent\" IDENT \"{\" { permit_decl } budget_decl task { task } \"}\" EOF ;\npermit_decl  = \"permit\" IDENT { \",\" IDENT } \";\" ;\nbudget_decl  = \"budget\" \"calls\" \"=\" INT \";\" ;\ntask         = \"task\" IDENT \"(\" [ param { \",\" param } ] \")\" \"->\" type block ;\nparam        = IDENT \":\" type ;\ntype         = \"string\" | \"int\" | \"bool\" | \"list\" \"\u003c\" type \">\" ;\nblock        = \"{\" { statement } \"}\" ;\nstatement    = let_stmt | if_stmt | repeat_stmt | return_stmt | expr_stmt ;\nlet_stmt     = \"let\" IDENT \"=\" expr \";\" ;\nif_stmt      = \"if\" \"(\" expr \")\" block [ \"else\" block ] ;\nrepeat_stmt  = \"repeat\" ( INT | IDENT ) block ;\nreturn_stmt  = \"return\" expr \";\" ;\nexpr_stmt    = expr \";\" ;\nexpr         = equality ;\nequality     = relational { ( \"==\" | \"!=\" ) relational } ;\nrelational   = additive { ( \"\u003c\" | \"\u003c=\" | \">\" | \">=\" ) additive } ;\nadditive     = term { ( \"+\" | \"-\" ) term } ;\nterm         = postfix { \"*\" postfix } ;\npostfix      = primary { \"[\" expr \"]\" } ;\nprimary      = INT | STRING | \"true\" | \"false\"\n             | IDENT [ \"(\" [ expr { \",\" expr } ] \")\" ]\n             | \"(\" expr \")\" ;\n```\n\n**AST nodes** (`agentscript/ast_nodes.py`, dataclasses). Every node keeps a source position,\nbecause every later diagnostic needs one.\n\n| Node | Fields | Position (`line`, `col`) points at |\n| --- | --- | --- |\n| `Agent` | `name`, `permits: list[Permit]`, `budget: Budget`, `tasks: list[Task]` | `agent` keyword |\n| `Permit` | `tools: list[NameRef]` | `permit` keyword |\n| `NameRef` | `name` (a tool name inside `permit`) | the identifier |\n| `Budget` | `calls: int` | `budget` keyword |\n| `Task` | `name`, `params: list[Param]`, `return_type: Type`, `body: Block` | `task` keyword |\n| `Param` | `name`, `declared_type: Type` | the parameter name |\n| `Block` | `statements`, plus `end_line`, `end_col` of the closing `}` | the `{` |\n| `Let` | `name`, `value: Expr`, plus `name_line`, `name_col` | `let` keyword (E302 uses the name position) |\n| `If` | `cond`, `then_block`, `else_block` (or `None`) | `if` keyword |\n| `Repeat` | `count: IntLit or Name`, `body: Block` | `repeat` keyword |\n| `Return` | `value: Expr` | `return` keyword |\n| `ExprStmt` | `expr: Expr` | its expression |\n| `IntLit`, `StrLit`, `BoolLit` | `value` (`StrLit.value` is unescaped) | the literal token |\n| `Name` | `name` | the identifier |\n| `Call` | `tool`, `args: list[Expr]` | the tool name |\n| `Index` | `base`, `index` | the `[` |\n| `Binary` | `op`, `left`, `right` | the operator |\n\nEvery expression node also has a `type` field, empty after parsing and filled in by semantic\nanalysis. Types written in the source (`list\u003cstring>`) are parsed straight into `Type` values\nfrom `agentscript/typesys.py`.\n\nTwo helpers come with the nodes: `ast_to_dict()` (JSON for the editor and the API) and\n`format_ast()` (the indented text tree, also what the golden files store).\n\nWhat the AST leaves out: parentheses (grouping is in the tree shape), semicolons, commas and\nthe `->`. The end position of a block is kept because E304 (missing return) is reported at\nthe closing `}` of a task body.\n\n## 3. Algorithm\n\nIn plain words: recursive descent. There is one function per grammar rule; each function\nconsumes the tokens of its rule and returns the AST node for it. The parser keeps one index\ninto the token list. `peek()` looks at the current token, and `expect(kind)` consumes it if it\nhas the right kind or raises E201 otherwise. Repetition in the grammar (`{ ... }`) becomes a\n`while` loop, optional parts (`[ ... ]`) become an `if`.\n\nThe grammar is LL(1): one token of lookahead is always enough to pick the right rule, so the\nparser never backtracks.\n\n| Decision point | Token that decides |\n| --- | --- |\n| which statement | `let`, `if`, `repeat`, `return`; anything else starts an expression statement |\n| more permits or the budget | `permit` vs `budget` |\n| another task | `task` vs `}` |\n| `else` part | `else` |\n| call or plain name | an `IDENT` followed by `(` is a call |\n| repeat count | `INT` or `IDENT` (anything else is E201) |\n\n**Precedence and associativity** come from the layering of the expression rules: each level\ncalls the next-higher level for its operands, so `*` binds tighter than `+`, which binds tighter\nthan `\u003c`, which binds tighter than `==`. Each level is a loop that folds operators to the left,\nwhich makes every binary operator left-associative: `a - b - c` parses as `(a - b) - c`. Postfix\nindexing is a loop too, so `xs[0][1]` is `(xs[0])[1]`.\n\n```\nparse_program():\n    expect(\"agent\"); name = expect(IDENT); expect(\"{\")\n    permits = []\n    while peek() is \"permit\": permits.append(parse_permit())\n    budget = parse_budget()      # E201 \"expected 'permit' or 'budget'\" if the next token is neither\n    tasks = [parse_task()]       # E201 \"expected 'task'\" if there is none\n    while peek() is \"task\": tasks.append(parse_task())\n    expect(\"}\")                  # E201 \"expected 'task' or '}'\"\n    expect(EOF)\n    return Agent(name, permits, budget, tasks)\n\nparse_statement():\n    if peek() is \"let\":     t = advance(); n = expect(IDENT); expect(\"=\"); e = parse_expr(); expect(\";\")\n                            return Let(n.text, e, at t, name at n)\n    if peek() is \"if\":      t = advance(); expect(\"(\"); c = parse_expr(); expect(\")\")\n                            then = parse_block()\n                            other = parse_block() if accept(\"else\") else None\n                            return If(c, then, other, at t)\n    if peek() is \"repeat\":  t = advance(); count = IntLit or Name from expect(INT or IDENT)\n                            return Repeat(count, parse_block(), at t)\n    if peek() is \"return\":  t = advance(); e = parse_expr(); expect(\";\"); return Return(e, at t)\n    e = parse_expr(); expect(\";\"); return ExprStmt(e)\n\nparse_binary_level(ops, next_level):        # used for equality, relational, additive, term\n    left = next_level()\n    while peek() in ops:\n        op = advance(); right = next_level()\n        left = Binary(op.text, left, right, at op)\n    return left\n\nparse_postfix():\n    e = parse_primary()\n    while peek() is \"[\":\n        b = advance(); i = parse_expr(); expect(\"]\"); e = Index(e, i, at b)\n    return e\n\nparse_primary():\n    INT / STRING / true / false  -> literal node\n    IDENT followed by \"(\"        -> Call(name, comma-separated parse_expr() list, at name)\n    IDENT                        -> Name\n    \"(\"                          -> e = parse_expr(); expect(\")\"); return e\n    otherwise                    -> E201 \"expected expression, found \u003ctoken>\"\n\nparse_type():\n    \"string\" | \"int\" | \"bool\"    -> STRING | INT | BOOL\n    \"list\" \"\u003c\" parse_type() \">\"  -> list_of(elem)\n```\n\n**E201 location rule.** When `expect` fails, it reports \"expected X, found Y\". The position is\nchosen like this:\n\n```\nif found.line > prev.line:      # the missing token belonged at the end of the previous line\n    report at (prev.line, prev.col + len(prev.text))\nelse:\n    report at (found.line, found.col)\n```\n\n`prev` is the last token consumed. For `syntax_missing_semicolon.as`, line 6 is\n`let a = web_search(topic)` with no `;`; the token found is `return` on line 7, so the error is\nreported just after the `)` that ends line 6, at 6:30, which is where the user has to type the\n`;`.\n\nThe \"expected X\" part is usually the token kind (`';'`, `identifier`), but some call sites name\nwhat makes sense to the user: `agent name`, `task name`, `parameter name`, `tool name`, `type`,\n`expression`, `integer or identifier` (repeat count), `',' or ')'` (argument and parameter\nlists), `',' or ';'` (permit). The \"found Y\" part shows the token: `'return'`,\n`identifier 'x'`, `integer 42`, `string \"abc\"` or `end of file`.\n\n**Nesting limit.** Later phases walk the AST recursively, so the parser bounds nesting at\n`MAX_NESTING = 1000`. While parsing, every block and every expression (each `(`, `[` index and\ncall argument opens a new one) increases a depth counter; going past 1000 is E201 \"expected at\nmost 1000 levels of nesting, found \u003ctoken>\". After parsing, `check_nesting()` walks the finished\nAST iteratively and reports the first node deeper than 1000 statement/block/expression levels\n(for example a chain of 5000 `+`, which is left-deep but needs no parentheses) as E201 \"expected\nat most 1000 levels of nesting, found a deeper expression\".\n\n## 4. Worked example\n\nInput: `examples/valid_report.as` (the full listing with line numbers is in\n[02-lexer.md](02-lexer.md), section 4). Output of\n`.venv/bin/python -m agentscript compile examples/valid_report.as --phase ast`:\n\n```\nAgent Assistant @1:1\n  Permit [web_search, llm, sanitize, send_email, confirm] @2:3\n  budget:\n    Budget 5 @3:3\n  Task report return_type=bool @5:3\n    Param topic declared_type=string @5:15\n    body:\n      Block @5:38\n        Let raw @6:5\n          Call web_search : list\u003cstring> @6:15\n            Name topic : string @6:26\n        Let clean @7:5\n          Call sanitize : string @7:17\n            Index : string @7:29\n              Name raw : list\u003cstring> @7:26\n              IntLit 0 : int @7:30\n        Let summary @8:5\n          Call llm : string @8:19\n            Binary + : string @8:37\n              StrLit 'Summarize: ' : string @8:23\n              Name clean : string @8:39\n        If @9:5\n          Call confirm : bool @9:9\n            StrLit 'Send report?' : string @9:17\n          then_block:\n            Block @9:34\n              Return @10:7\n                Call send_email : bool @10:14\n                  StrLit 'me@example.com' : string @10:25\n                  Name summary : string @10:43\n        Return @12:5\n          BoolLit False : bool @12:12\n```\n\nEach line is one node, its main fields, and `@line:col`. The `: type` after each expression is\nnot produced by the parser: the pipeline re-renders the AST tab after semantic analysis so\nthat it shows the static types (straight after parsing every `type` field is still empty).\n\nWhat to notice:\n\n- **Punctuation is gone.** No `;`, `,`, `->` or parentheses appear; `let raw = web_search(topic);`\n  is just `Let raw` with one child, the `Call`.\n- **Calls by syntax.** `web_search(topic)` is a `Call` because the `IDENT` is followed by `(`;\n  `topic` on its own is a `Name`. The call sits at the tool name (6:15), the same position the\n  lexer gave the `web_search` token.\n- **Postfix indexing.** In `sanitize(raw[0])` (line 7) the argument is an `Index` node with\n  `base = Name raw` and `index = IntLit 0`, positioned at the `[` (7:29), not at `raw` (7:26).\n- **Binary node.** `\"Summarize: \" + clean` on line 8 went through the expression levels\n  `equality -> relational -> additive`: `parse_additive` read the `StrLit` as its left operand,\n  saw `+`, read `Name clean` as the right operand, and folded them into `Binary +`. The node is\n  positioned at the operator (8:37), its two children at their own tokens (8:23 and 8:39). The\n  `StrLit` holds the unescaped value `'Summarize: '`, without the source quotes.\n- **If with no else.** The `If` on line 9 has a `Call confirm` as its condition and a\n  `then_block`; there is no `else_block` line because the field is `None`.\n- **Blocks keep their `{`.** `Block @5:38` is the task body's `{`; its closing `}` (13:3) is\n  stored in `end_line`/`end_col` and is not printed in the tree, but E304 uses it.\n\n## 5. Errors this phase catches\n\n| Code | Demo file (`examples/manifest.json`) | Expected location |\n| --- | --- | --- |\n| E201 syntax error | `syntax_missing_semicolon.as` | 6:30 |\n\n**Missing semicolon.** `examples/syntax_missing_semicolon.as`:\n\n```\n     5\t  task find(topic: string) -> list\u003cstring> {\n     6\t    let a = web_search(topic)\n     7\t    return a;\n```\n\n`.venv/bin/python -m agentscript compile examples/syntax_missing_semicolon.as` prints the token\nlisting (the lexer succeeded) and then the diagnostic:\n\n```\n== tokens ==\n  1:1   AGENT      agent\n...\n  6:5   LET        let\n  6:9   IDENT      a\n  6:11  ASSIGN     =\n  6:13  IDENT      web_search\n  6:23  LPAREN     (\n  6:24  IDENT      topic\n  6:29  RPAREN     )\n  7:5   RETURN     return\n  7:12  IDENT      a\n  7:13  SEMI       ;\n...\n\n== diagnostics ==\nE201 [parser] 6:30: expected ';', found 'return'\ncompilation failed\n```\n\nThe token found is `return` at 7:5, but it is on a later line than the previous token `)` at\n6:29, so the location rule reports 6:29 + len(\")\") = **6:30**, the end of line 6.\n\n**Missing closing brace.** Covered by `test_missing_closing_brace_at_eof` in\n`tests/test_parser.py` (no demo file). The same program saved as a scratch file `missing_brace.as`:\n\n```\n     1\tagent A {\n     2\t  budget calls = 1;\n     3\t  task t() -> int {\n     4\t    return 1;\n     5\t  }\n```\n\n`.venv/bin/python -m agentscript compile missing_brace.as` ends with:\n\n```\n== diagnostics ==\nE201 [parser] 5:4: expected 'task' or '}', found end of file\ncompilation failed\n```\n\nAfter the task, the parser accepts another `task` or the agent's `}`; it finds `EOF` on line 6,\nso the error goes right after the task's `}` on line 5.\n\n**Nesting limit.** A `return` of 1001 nested parentheses (`return ((((...1...))));` on line 4,\nscratch file) gives:\n\n```\n== diagnostics ==\nE201 [parser] 4:1011: expected at most 1000 levels of nesting, found '('\ncompilation failed\n```\n\n`parse_expr` is entered once for the return value and once per `(`, so the 1000th `(` (column\n12 + 999 = 1011) is the one refused.\n\n## 6. Design decisions and limitations\n\n| Decision | Why |\n| --- | --- |\n| Hand-written recursive descent, no parser generator. | The PRD asks for it (F2), the grammar is LL(1), and each grammar rule maps to one readable function, which is easy to present and to step through in a debugger. |\n| Precedence by grammar layering instead of a precedence table (Pratt parsing). | With five levels, layered rules are the textbook approach and the grammar itself documents the precedence. |\n| Operators are left-associative, including comparisons. | One loop shape for every level. `a \u003c b \u003c c` parses as `(a \u003c b) \u003c c` and is then rejected by the type checker (E303: `bool \u003c int`), which gives a clearer message than a special syntax rule. |\n| `repeat` takes only an `INT` or an `IDENT`, not an expression. | The budget check needs to see at a glance whether the count is a literal (exact count) or a variable (W306 and runtime check). `repeat 2 + 1` is a syntax error. |\n| No `else if`. | `else` must be followed by a block; write `else { if (...) { ... } }`. One less grammar rule, and the CFG shape is the same. |\n| Exactly one `budget`, after the permits, and at least one task. | Fixed order means the parser needs no extra checks: a missing or second `budget` is simply \"expected X, found Y\". |\n| Calls are recognised by syntax (`IDENT (`), not by name. | The parser does not need the tool table; whether the name is a real tool is a semantic question (E301), checked in one place. |\n| No error recovery; the first E201 stops compilation. | Recovery is hard to get right and produces cascades of follow-on errors. The PRD lists it as a risk; one precise error is more useful for a demo. |\n| The E201 location rule above. | Without it, a missing `;` at the end of a line would be reported at the first token of the next line, which points the user at the wrong line. |\n| Positions on every node. | Every later phase reports errors at source positions, and the IR copies them from the AST. |\n\nLimitations:\n\n- Only the first syntax error is reported.\n- The message only names what was expected and what was found; it does not suggest a fix.\n- Expression statements accept any expression (`1 + 2;` is legal and does nothing); only tool\n  calls are useful there.\n\n## 7. Where it lives in the code\n\n**`agentscript/parser.py`**\n\n| Name | What it is |\n| --- | --- |\n| `parse(tokens)` | public entry point: `Parser(tokens).parse_program()`, then `check_nesting()`; returns the `Agent` or raises `CompileError` E201. |\n| `Parser` | the recursive-descent parser. Holds `tokens`, `pos` and the nesting `depth`; the constructor rejects a token list that does not end in `EOF`. |\n| `peek()`, `check(*kinds)`, `advance()`, `expect(kind, what=None)` | token helpers; `advance()` never steps past `EOF`; `expect` raises through `error()`. |\n| `error(expected)` | builds the E201 diagnostic and applies the location rule (found token, or just after the previous token when the found token is on a later line). |\n| `describe_kind()`, `describe_token()` | the \"expected X\" and \"found Y\" wording. |\n| `parse_program`, `parse_permit` (+ `_name_ref`), `parse_budget`, `parse_task`, `parse_param`, `parse_type` | declaration rules. |\n| `parse_block` (+ `_block`), `parse_statement`, `parse_let`, `parse_if`, `parse_repeat`, `parse_return` | statement rules; `parse_statement` dispatches on `let`/`if`/`repeat`/`return`, otherwise an expression statement. |\n| `parse_expr`, `parse_equality`, `parse_relational`, `parse_additive`, `parse_term`, `parse_postfix`, `parse_primary` (+ `_call_args`) | expression rules, one per precedence level; the four binary levels share `_binary_level(ops, operand)`. |\n| `enter()`, `MAX_NESTING`, `check_nesting(agent)` | the nesting bound (during parsing and on the finished AST). |\n\n**`agentscript/ast_nodes.py`**: the node dataclasses (`Agent`, `Permit`, `NameRef`, `Budget`,\n`Task`, `Param`, `Block`, `Let`, `If`, `Repeat`, `Return`, `ExprStmt`, `IntLit`, `StrLit`,\n`BoolLit`, `Name`, `Call`, `Index`, `Binary`, with the base classes `Expr` and `Stmt`), plus\n`ast_to_dict()` and `format_ast()`. `Agent.permitted_tools()` flattens the permit lists.\n\n**`agentscript/pipeline.py`** runs the parser as stage 2 of `_run_stages()`:\n`res.agent = parse(res.tokens)`, then\n`phases[\"ast\"] = {\"text\": format_ast(res.agent), \"data\": ast_to_dict(res.agent)}`; after\nsemantic analysis the `ast` artifact is rendered again so it shows the expression types.\n\n**`tests/test_parser.py`** covers the AST shape and positions of `valid_report.as`,\n`format_ast`/`ast_to_dict`, every statement form, types, precedence and associativity, node\npositions, many E201 cases (missing `;`, `)`, `}`, budget order, trailing tokens, bad repeat\ncounts, unsupported constructs), the location rule, the nesting limit, and every example in\n`examples/manifest.json` (`test_examples_parse_per_manifest`).\n"}, {"id": "how-it-works--04-semantic-analysis", "path": "docs/how-it-works/04-semantic-analysis.md", "group": "How it works", "title": "04. Semantic analysis: scopes, types, permission and budget", "nav": "Semantic analysis", "md": "# 04. Semantic analysis: scopes, types, permission and budget\n\n## 1. What this phase does\n\n| | |\n| --- | --- |\n| Input | The AST from the parser. |\n| Output | The same AST with a static type set on every expression (`Expr.type`), a symbol table, the budget result per task, and a list of warnings (W306). Packed as a `SemanticResult` whose `{text, data}` artifact fills the Symbols tab. |\n| Place in the pipeline | Stage 3 of 10, the third classic phase and the last front-end phase. It is also the first safety stage: the permission and budget checks happen here, on the source program, long before any optimization. IR generation (stage 4) assumes the AST it receives has passed this phase. |\n| Errors | E301 undeclared name / unknown tool, E302 duplicate declaration, E303 type mismatch, E304 missing return, E305 tool not permitted, E306 budget exceeded; warning W306. |\n\nThe parser only knows what the program looks like. This phase decides what it means: which\ndeclaration every name refers to, what type every expression has, whether every tool call is\nallowed, and whether the task can stay inside its call budget.\n\nIt runs in two passes:\n\n1. **One walk over the AST in source order** that checks scopes, types, returns and permissions\n   together. The first error found stops compilation.\n2. **The budget check**, once per task, after the walk has succeeded.\n\n## 2. Key data structures\n\n**Symbol.** One entry per declared name. It records the name, its kind (`tool`, `task`,\n`param` or `variable` for a `let`), its type (for a tool or task, the return type plus a\n`params` tuple of parameter types, printed as a signature like `(string) -> list\u003cstring>`) and\nthe line and column of its declaration (the built-in tools have no source position, `0:0`).\n\n**Scope.** A dictionary from name to `Symbol`, a kind (`builtins`, `agent`, `task`, `block`), a\nname, a link to the enclosing scope and a list of child scopes (kept so the whole tree can be\nprinted). Block scopes are named `\u003ctask>.\u003cn>`, numbered per task in the order they are opened.\nThe chain for a statement inside the `if` in task `report` of `valid_report.as`:\n\n```\nbuiltins              web_search, read_file, llm, send_email, delete_file, sanitize, confirm   (kind tool)\n  agent Assistant     report                                                   (kind task)\n    task report       topic : string                                           (kind param)\n      block report.1  raw, clean, summary                                      (the task body)\n        block report.2                                                         (the if block)\n```\n\n| Operation | Behaviour |\n| --- | --- |\n| `lookup(name)` | Search this scope, then each enclosing scope outward; not found means E301. |\n| `declare(symbol)` | If `lookup(name)` finds anything (in this scope **or any enclosing one**), E302. Otherwise add it here. |\n\nBecause `declare` checks the whole chain, there is no shadowing: a `let` cannot reuse a\nparameter, task or tool name, and a nested block cannot reuse a name from an outer block.\nSibling blocks can reuse a name, because a sibling's scope is gone by the time the next block\nis entered.\n\n**Types.** `Type` values from `agentscript/typesys.py`: `STRING`, `INT`, `BOOL` and\n`list_of(T)`. Equality of types is structural (`list\u003cstring> == list\u003cstring>`).\n\n**Tool table.** `TOOLS` from `agentscript/tools.py`: each `ToolSpec` gives the parameter types\nand the return type used for call checking. The safety annotations in it are not used here;\nthey are used by the taint, approval and optimizer stages.\n\n**Permitted set.** The set of tool names from all `permit` declarations.\n\n**BudgetInfo.** Per task: the worst-path call count, the agent's budget, the worst path itself\nas a list of call sites `(tool, line, col)` (at most `MAX_LISTED_CALLS` = 100 of them), and\n`dynamic_loops`, true when some `repeat x` was counted once. It is what the Symbols tab shows\nnext to each task (`check` is `static`, or `runtime` when `dynamic_loops` is set).\n\n**SemanticResult.** `root_scope` (the builtins scope, the root of the scope tree), `budget`\n(the `BudgetInfo` of every task), `warnings` (a list of `Diagnostic`, currently only W306) and\n`permits` (the permitted tool names in source order). Its `artifact()` method produces the\n`{text, data}` pair.\n\n## 3. Algorithm\n\n### 3.1 Declarations and permits\n\nIn plain words: fill the builtins scope with the seven tools, then read the `permit` lists, then\nput every task name in the agent scope before looking at any task body (task names are\nhoisted). The hoisting pass reports nothing: a duplicate task name, or a task named like a\ntool, is reported with E302 only when the walk reaches that task, so errors stay in source\norder.\n\n```\nbuiltins = Scope(\"builtins\");  for tool in TOOLS: builtins.declare(Symbol(tool, \"tool\", ...))\nagent_scope = builtins.child(\"agent\", agent.name)\npermitted = []\nfor ref in every permit list (source order):\n    if ref.name not in TOOLS:   E301 \"unknown tool '...' in permit\" at ref\n    if ref.name in permitted:   E302 \"tool '...' is already permitted at L:C\" at ref\n    permitted.append(ref.name)\nfor task in tasks:              # hoist; first owner of a free name wins, no error here\n    if task.name is not a tool and not yet in agent_scope: agent_scope[task.name] = task symbol\nfor task in tasks:\n    if task is not the hoisted owner of its name: agent_scope.declare(task)   # E302\n    check_task(task)\n```\n\n### 3.2 The source-order walk (scopes, types, permission, returns)\n\nIn plain words: for each task, open a scope for its parameters and a scope for its body, then\nvisit every statement in order. Each statement declares or uses names and checks the types of\nits expressions. Each expression is checked bottom-up: first its children get a type, then the\noperator or call rule decides the expression's own type (or reports E303). The type is stored in\n`Expr.type`, where later phases read it.\n\n```\ncheck_task(task):\n    params = agent_scope.child(\"task\", task.name)\n    for p in task.params: params.declare(p.name, \"param\", p.declared_type)   # E302\n    check_block(task.body, params, task.return_type)\n    if not always_returns(task.body):  E304 at the closing \"}\" of task.body\n\ncheck_block(block, parent, ret):\n    scope = parent.child(\"block\", task.name + \".\" + n)\n    for s in block.statements:\n        Let:      t = type_of(s.value, scope)        # before declaring: `let x = x;` is E301\n                  scope.declare(s.name, \"variable\", t)                           # E302 at the name\n        If:       require type_of(s.cond) == bool                                # E303\n                  check_block(s.then_block, scope, ret); check_block(s.else_block, scope, ret)\n        Repeat:   if s.count is a Name: require lookup(count).type == int        # E301 / E303\n                  check_block(s.body, scope, ret)\n        Return:   require type_of(s.value) == ret                                # E303\n        ExprStmt: type_of(s.expr)\n\ntype_of(e, scope):\n    IntLit -> int;  StrLit -> string;  BoolLit -> bool\n    Name   -> lookup(e.name).type; must be a param or variable                # E301\n    Index  -> base must be list\u003cT>, index must be int; result T               # E303\n    Binary -> operand rule from the operator table below; result type         # E303\n    Call   -> 1. e.tool must be a built-in tool                               # E301 \"unknown tool\"\n              2. e.tool must be in permitted                                  # E305\n              3. type every argument (left to right)                          # errors inside args\n              4. the argument count must match the signature                  # E303 at the call\n              5. each argument type must match its parameter                  # E303 at the argument\n              result = the tool's return type\n\nalways_returns(block):\n    any statement s in block where\n        s is Return, or\n        s is If with an else block and always_returns(then) and always_returns(else)\n    (Repeat never counts: it may run zero times)\n```\n\nThe operator rules (E303 when the operands do not fit):\n\n| Operator | Operands | Result |\n| --- | --- | --- |\n| `+` | `int, int` or `string, string` | `int` or `string` |\n| `-` `*` | `int, int` | `int` |\n| `\u003c` `\u003c=` `>` `>=` | `int, int` | `bool` |\n| `==` `!=` | same type, one of `int`, `bool`, `string` | `bool` |\n| `e[i]` | `list\u003cT>`, `int` | `T` |\n\nA call to a task name is E301 \"unknown tool\" (with the hint \"tasks cannot call tasks\"), because\ntasks live in the agent scope with kind `task`, not `tool`. This is how \"tasks cannot call\ntasks\" is enforced: there is no separate rule. In the same way, using a tool or task name as a\nvalue (`return llm;`) is E301, since only `param` and `variable` symbols have a value.\n\nThe permission check comes before the arguments are looked at, so `llm(zzz)` with `llm` not\npermitted is E305, not E301 for `zzz`.\n\n### 3.3 The budget check (worst-path count)\n\nIn plain words: walk each task body again and build the longest possible sequence of tool calls\nthat one run could make, following these rules. If that sequence is longer than the budget,\nreport E306 at the first call that does not fit.\n\n| Construct | Worst path |\n| --- | --- |\n| sequence of statements | the paths of the statements, concatenated |\n| tool call | the calls inside its arguments (left to right), then the call itself |\n| other expression | the calls inside it, left to right |\n| `if (c) A else B` | calls in `c`, then the longer of the paths of `A` and `B` (missing `else` = empty) |\n| `repeat 3 { A }` | the path of `A`, three times |\n| `repeat x { A }` | the path of `A`, once, plus warning W306 at `x` |\n\nEvery tool counts 1, including `sanitize` and `confirm`.\n\n```\nworst_block(stmts):  return concat(worst_stmt(s) for s in stmts)\n\nworst_stmt(s):\n    Let / Return / ExprStmt:  return calls_in(s's expression)\n    If:      a = worst_block(then); b = worst_block(else) if else else []\n             return calls_in(cond) + (a if len(a) >= len(b) else b)\n    Repeat:  body = worst_block(s.body)\n             if count is IntLit: return body repeated max(count, 0) times\n             else: warn W306 \"repeat count `x` is not a literal; the budget for this loop\n                   is enforced at runtime\" at the count; return body\n\ncalls_in(e):          # evaluation order: arguments first, then the call\n    Call:   concat(calls_in(a) for a in args) + [call site of e]\n    Binary: calls_in(left) + calls_in(right)\n    Index:  calls_in(base) + calls_in(index)\n    other:  []\n\ncheck_budget(task):\n    path = worst_block(task.body.statements)\n    if l
