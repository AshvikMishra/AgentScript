<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentScript Editor</title>
  <meta name="description" content="AgentScript: a tiny language and compiler for safe AI agents. Edit, compile and run programs and inspect every compiler phase.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffc917">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2316181d'/%3E%3Cpath d='M8 16h14m-6-7 7 7-7 7' stroke='%23ffc917' stroke-width='3.2' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
  <script>
    /* Apply the saved theme before first paint, so the page never flashes the other one. */
    try { var t = localStorage.getItem("agentscript.theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="AgentScript editor home">
      <span class="brand-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 12h13M12 5l7 7-7 7"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">AgentScript</span>
        <span class="brand-sub">Compiler for safe AI agents</span>
      </span>
    </a>

    <div class="example-pick">
      <label class="example-label" for="example-select">Example</label>
      <select id="example-select" class="select select-sign">
        <option value="">Loading...</option>
      </select>
    </div>

    <nav class="mast-tools" aria-label="Site">
      <a class="mast-link" href="/docs/">Docs</a>
      <a class="mast-link" href="https://github.com/AshvikMishra/AgentScript" target="_blank" rel="noopener">GitHub</a>
      <span class="mast-sep" aria-hidden="true"></span>
      <div class="zoom" role="group" aria-label="Code font size">
        <button type="button" class="mast-btn" id="zoom-out" title="Smaller code font" aria-label="Smaller code font">A&#8722;</button>
        <button type="button" class="mast-btn" id="zoom-in" title="Larger code font" aria-label="Larger code font">A+</button>
      </div>
      <button type="button" class="mast-btn mast-icon" id="theme-btn" title="Switch light or dark" aria-label="Switch light or dark theme">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
    </nav>
  </header>

  <nav class="gates" aria-label="Compiler pipeline: the ten stages">
    <ol id="pipeline-strip" class="gate-row"></ol>
  </nav>

  <div id="channel" class="channel" data-kind="busy">
    <span class="channel-icon" aria-hidden="true"></span>
    <span id="status" class="status" role="status" aria-live="polite">Loading examples...</span>
    <span id="channel-expect" class="channel-expect"></span>
  </div>

  <main class="workspace">
    <section class="pane pane-source" aria-label="Source">
      <div class="pane-head">
        <h2 class="pane-title">Source</h2>
        <p id="example-desc" class="example-desc"></p>
      </div>

      <div class="editor-wrap">
        <div id="editor-host" class="editor-host">
          <textarea id="source" class="source-fallback" spellcheck="false" aria-label="AgentScript source"></textarea>
        </div>
      </div>

      <div class="action-bar">
        <button type="button" id="compile-btn" class="btn btn-compile">
          <span class="btn-label">Compile</span>
          <span class="kbds"><kbd class="kbd" data-mod>Ctrl</kbd><kbd class="kbd">Enter</kbd></span>
        </button>
        <span id="edit-hint" class="edit-hint" hidden>Edited since the last compile</span>
      </div>

      <div class="run-dock" aria-label="Run">
        <div class="run-grid">
          <div class="run-field">
            <label class="field-label" for="task-select">Task</label>
            <select id="task-select" class="select" disabled>
              <option value="">Compile first</option>
            </select>
          </div>
          <div class="run-field run-args">
            <label class="field-label" for="args-input">Arguments (JSON)</label>
            <textarea id="args-input" class="args-input" rows="1" spellcheck="false">{}</textarea>
          </div>
        </div>
        <div class="run-row">
          <div class="segmented seg-confirm" role="radiogroup" aria-label="Answer to confirm()">
            <span class="seg-caption">confirm()</span>
            <button type="button" class="seg-btn is-on" role="radio" aria-checked="true" data-confirm="true">Approve</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-confirm="false">Deny</button>
          </div>
          <label class="switch" title="Use real llm and web_search (side-effecting tools stay simulated)">
            <input type="checkbox" id="live-toggle">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span class="switch-label">Live tools</span>
          </label>
          <button type="button" id="run-btn" class="btn btn-run">
            <span class="btn-label">Run</span>
            <span class="kbds"><kbd class="kbd" data-mod>Ctrl</kbd><kbd class="kbd">Shift</kbd><kbd class="kbd">Enter</kbd></span>
          </button>
        </div>
      </div>
    </section>

    <section class="pane pane-output" aria-label="Compiler output">
      <div class="tabbar-wrap">
        <div id="tabbar" class="tabbar" role="tablist" aria-label="Phase artifacts"></div>
      </div>
      <div id="panels" class="panels"></div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
