<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentScript Editor</title>
  <meta name="description" content="AgentScript: a tiny language and compiler for safe AI agents. Edit, compile and run programs and inspect every compiler phase.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z' fill='%237c8cff'/%3E%3Cpath d='m11 16 3.5 3.5L21 13' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z"></path>
        <path class="tick" d="m11 16 3.5 3.5L21 13"></path>
      </svg>
      <div class="brand-text">
        <h1>AgentScript</h1>
        <p class="subtitle">A tiny language and compiler for safe AI agents</p>
      </div>
    </div>
    <div class="header-tools">
      <span id="status" class="status" role="status" aria-live="polite">Loading examples...</span>
      <div class="zoom" role="group" aria-label="Code font size">
        <button type="button" class="btn btn-ghost btn-small" id="zoom-out" title="Smaller code font" aria-label="Smaller code font">A&#8722;</button>
        <button type="button" class="btn btn-ghost btn-small" id="zoom-in" title="Larger code font" aria-label="Larger code font">A+</button>
      </div>
    </div>
  </header>

  <nav class="pipeline" aria-label="Compiler pipeline">
    <ol id="pipeline-strip" class="pipeline-strip"></ol>
  </nav>

  <main class="workspace">
    <section class="pane pane-left" aria-label="Source">
      <div class="example-bar">
        <label class="field-label" for="example-select">Example</label>
        <select id="example-select" class="select">
          <option value="">Loading...</option>
        </select>
        <p id="example-desc" class="example-desc"></p>
      </div>

      <div class="editor-wrap">
        <div id="editor-host" class="editor-host">
          <textarea id="source" class="source-fallback" spellcheck="false" aria-label="AgentScript source"></textarea>
        </div>
      </div>

      <div class="action-bar">
        <button type="button" id="compile-btn" class="btn btn-primary">
          <span class="btn-label">Compile</span>
          <kbd class="kbd" data-mod>Ctrl</kbd><kbd class="kbd">Enter</kbd>
        </button>
        <span id="edit-hint" class="edit-hint" hidden>Edited since last compile</span>
      </div>

      <div class="run-card" aria-label="Run">
        <div class="run-grid">
          <div class="run-field">
            <label class="field-label" for="task-select">Task</label>
            <select id="task-select" class="select" disabled>
              <option value="">Compile first</option>
            </select>
          </div>
          <div class="run-field run-args">
            <label class="field-label" for="args-input">Arguments (JSON)</label>
            <textarea id="args-input" class="args-input" rows="2" spellcheck="false">{}</textarea>
          </div>
        </div>
        <div class="run-row">
          <div class="segmented" role="radiogroup" aria-label="Answer to confirm()">
            <span class="seg-caption">confirm()</span>
            <button type="button" class="seg-btn is-on" role="radio" aria-checked="true" data-confirm="true">Approve</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-confirm="false">Deny</button>
          </div>
          <label class="switch" title="Use real llm and web_search (side-effecting tools stay simulated)">
            <input type="checkbox" id="live-toggle">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span class="switch-label">Live tools</span>
          </label>
          <button type="button" id="run-btn" class="btn btn-run">
            <span class="btn-label">Run</span>
            <kbd class="kbd" data-mod>Ctrl</kbd><kbd class="kbd">Shift</kbd><kbd class="kbd">Enter</kbd>
          </button>
        </div>
      </div>
    </section>

    <section class="pane pane-right" aria-label="Compiler output">
      <div class="tabbar-wrap">
        <div id="tabbar" class="tabbar" role="tablist" aria-label="Phase artifacts"></div>
      </div>
      <div id="panels" class="panels"></div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
